name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Rocq (Abbreviation needs 9.2): only the default
          # warnings fail (warning sets differ between Rocq versions).
          - image: 'rocq/rocq-prover:9.2'
            profile: release
          # The development version: every warning fails, as locally.
          - image: 'rocq/rocq-prover:9.3'
            profile: dev
          # Upcoming Rocq: reported, but does not fail the workflow.
          - image: 'rocq/rocq-prover:dev'
            profile: release
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: rocq-community/docker-coq-action@v1
        with:
          opam_file: 'rocq-hylomorphisms.opam'
          custom_image: ${{ matrix.image }}
          before_script: |
            startGroup "Workaround permission issue"
              sudo chown -R 1000:1000 .
            endGroup
          # Plain `dune build` (rather than `opam install`) also builds the
          # extraction targets, which are not part of the installed package.
          script: |
            startGroup "Build"
              dune build --display short --profile ${{ matrix.profile }}
            endGroup
            startGroup "Check generated opam file is up to date"
              git diff --exit-code rocq-hylomorphisms.opam
            endGroup
          uninstall: ''
